name: Build & release TESL-Manager.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v1.0.0). Пусто при пуше тега — берётся из тега."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # В отличие от TESL/launcher — здесь нет встроенного секрета: оператор
      # вводит WebDAV-логин/пароль сам в GUI, хранится локально в
      # %APPDATA%\Uploder\config.json (см. config.py DEFAULT_WEBDAV_CONFIG,
      # пустой по умолчанию), ничего не встраивается в сборку.
      - name: Build TESL-Manager.exe
        working-directory: depot_sync_manager
        run: >
          pyinstaller --noconsole --onefile --icon=icon.ico
          --add-data "icon.ico;." --name TESL-Manager main.py

      - name: Verify build output
        shell: bash
        run: test -f depot_sync_manager/dist/TESL-Manager.exe

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            echo "::error::Укажите тег в inputs.tag или запускайте по тегу"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TESL-Manager-exe-${{ steps.tag.outputs.tag }}
          path: depot_sync_manager/dist/TESL-Manager.exe
          if-no-files-found: error

      - name: Create/update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          FILE="depot_sync_manager/dist/TESL-Manager.exe"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --repo "$REPO" \
              --target "$SHA" \
              --title "TESL-Manager $TAG" \
              --generate-notes
          fi
