name: Build & release TESL-Manager.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v1.0.0). Пусто при пуше тега — берётся из тега."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # В отличие от TESL/launcher — здесь нет встроенного секрета: оператор
      # вводит WebDAV-логин/пароль сам в GUI, хранится локально в
      # %APPDATA%\Uploder\config.json (см. config.py DEFAULT_WEBDAV_CONFIG,
      # пустой по умолчанию), ничего не встраивается в сборку.
      - name: Build TESL-Manager.exe
        working-directory: depot_sync_manager
        run: >
          pyinstaller --noconsole --onefile --windowed --icon=icon.ico
          --add-data "icon.ico;." --name TESL-Manager main.py

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TESL-Manager-exe-${{ steps.tag.outputs.tag }}
          path: depot_sync_manager/dist/TESL-Manager.exe

      - name: Create/update GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" "depot_sync_manager/dist/TESL-Manager.exe" \
            --repo "${{ github.repository }}" \
            --title "TESL-Manager $TAG" \
            --generate-notes \
          || gh release upload "$TAG" "depot_sync_manager/dist/TESL-Manager.exe" \
            --repo "${{ github.repository }}" --clobber
