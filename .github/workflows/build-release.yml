name: Build & release TESL-Manager.exe

on:
push:
tags:
- "v*"
workflow_dispatch:
inputs:
tag:
description: "Тег релиза (например v1.0.0)"
required: false
default: ""

permissions:
contents: write

jobs:
build:
runs-on: windows-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: pip
      cache-dependency-path: requirements.txt

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt

  # WebDAV credentials are entered by the user in the GUI.
  # No credentials are embedded in the executable.
  - name: Build TESL-Manager.exe
    working-directory: depot_sync_manager
    run: |
      python -m PyInstaller `
        --noconfirm `
        --clean `
        --noconsole `
        --onefile `
        --windowed `
        --icon=icon.ico `
        --add-data "icon.ico;." `
        --name TESL-Manager `
        main.py
    shell: pwsh

  - name: Resolve and validate release tag
    id: tag
    shell: bash
    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_TAG: ${{ inputs.tag }}
      REF_NAME: ${{ github.ref_name }}
    run: |
      set -euo pipefail

      if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
        TAG="$INPUT_TAG"
      else
        TAG="$REF_NAME"
      fi

      if [[ -z "$TAG" ]]; then
        echo "::error::Укажи тег релиза, например v1.0.0."
        exit 1
      fi

      if [[ ! "$TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
        echo "::error::Некорректный тег релиза: $TAG"
        exit 1
      fi

      echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      echo "Release tag: $TAG"

  - name: Verify executable
    shell: pwsh
    run: |
      $exe = "depot_sync_manager/dist/TESL-Manager.exe"

      if (!(Test-Path $exe)) {
        throw "Executable was not produced: $exe"
      }

      $file = Get-Item $exe
      Write-Host "Executable: $($file.FullName)"
      Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

      if ($file.Length -eq 0) {
        throw "Executable is empty."
      }

  - name: Upload build artifact
    uses: actions/upload-artifact@v4
    with:
      name: TESL-Manager-exe-${{ steps.tag.outputs.tag }}
      path: depot_sync_manager/dist/TESL-Manager.exe
      if-no-files-found: error
      compression-level: 0

  - name: Create or update GitHub release
    shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ steps.tag.outputs.tag }}
    run: |
      set -euo pipefail

      EXE="depot_sync_manager/dist/TESL-Manager.exe"

      if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
        echo "Release $TAG already exists; replacing executable."
        gh release upload "$TAG" "$EXE" \
          --repo "$REPO" \
          --clobber
      else
        echo "Creating release $TAG."
        gh release create "$TAG" "$EXE" \
          --repo "$REPO" \
          --title "TESL-Manager $TAG" \
          --generate-notes
      fi
